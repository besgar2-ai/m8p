<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M8P" />
    <meta name="theme-color" content="#0b0f14" />
    <title>M8P</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="icons/logo-topbar.png" alt="" class="brand-mark" />
            <h1 id="pageTitle">Rutinas</h1>
        </div>
    </header>

    <main id="app" class="app"></main>

    <nav class="tabbar">
        <button class="tab-btn active" data-tab="routines">
            <span class="icon">🏋️</span><span>Rutinas</span>
        </button>
        <button class="tab-btn" data-tab="history">
            <span class="icon">🕒</span><span>Historial</span>
        </button>
        <button class="tab-btn" data-tab="progress">
            <span class="icon">📈</span><span>Progreso</span>
        </button>
        <button class="tab-btn" data-tab="weight">
            <span class="icon">⚖️</span><span>Peso</span>
        </button>
        <button class="tab-btn" data-tab="recipes">
            <span class="icon">🥗</span><span>Recetas</span>
        </button>
        <button class="tab-btn" data-tab="program">
            <span class="icon">📅</span><span>Programa</span>
        </button>
    </nav>

    <script type="module" src="js/app.js"></script>
</body>
</html>
